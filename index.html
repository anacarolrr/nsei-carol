<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFleet - Gestão de Frota 00</title>
    <link rel="stylesheet" href="https>//cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <header role="banner" class="bg-primary text-white text-ce4nter py-3 mb-4 shadow">
        <h1>TechFleet Terminal - Mapeamento 00</h1>
        <p class="mb-0">Gerenciamento de veículos orientado a objetos</p>
    </header>
    <main role="main" class="container">
        <div class="row g-4">
            <!--painel de cadastro-->
            <section class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white font-weiht-bold">
                        Cadastrar Novo Veículo
                    </div>
                    <div class="card-body">
                        <form id="form-veiculo">
                            <div class="mb-3">
                                <label for="placa" class="form-label">Placa do Veículo:</label>
                                <input type="text" id="placa" class="form-control min-44" placeholder="Ex: ABC-1234"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="modelo" class="form-label">Modelo / Marca:</label>
                                <input type="text" id="modelo" class="form-control min-44"
                                    placeholder="Ex: Vans Cargo 2.0" required>
                            </div>
                            <div class="mb-3">
                                <label for="categoria" class="form-label">Categoria:</label>
                                <select id="categoria" class="form-select min-44" required>
                                    <option value="Transpote">Transporte de Carga</option>
                                    <option value="Manutenção">Manutenção Técnica</option>
                                    <option value="Inspeção">Inspeção do Campo</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 min-44 font-weiht-bold">
                                Instanciar e Salvar Veículo
                            </button>
                        </form>
                    </div>
                </div>
            </section>
            <!--Lista de veiulos renderizada via 00-->
            <section class="col-md-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-itens-center">
                        <span>Frota Ativa de Veículos</span>
                        <span id="contador-frota" class="badge bg-warning text-dark">0 Veículos</span>
                    </div>
                    <div class="card-body">
                        <div id="container-veiculos" class="row g-3">
                            <!--cards instaniados inseridos via JS-->
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
